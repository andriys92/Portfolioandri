<script type="module">
// KONFIGURASI APLIKASI
const IS_PREVIEW = false; // Ubah menjadi false SAAT DEPLOY / PUBLISH agar terhubung murni ke Firebase tanpa data dummy

// PASTE FIREBASE CONFIG ANDA DI SINI
const firebaseConfig = {
  apiKey: "AIzaSyA1FKuhWFfr1IrPT2AT2EBZl7-UdLmeMAc",
  authDomain: "portfolioandrianasuherman.firebaseapp.com",
  projectId: "portfolioandrianasuherman",
  storageBucket: "portfolioandrianasuherman.firebasestorage.app",
  messagingSenderId: "363832387274",
  appId: "1:363832387274:web:730fb8c9b949c544bdb633"
};

const $ = s => document.querySelector(s);
const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const S = {view:'home', cats:[], certs:[], profile:null, user:null, q:'', cat:'all', tab:'certs', loading:true, sort:'new', lim:9, msgs:[]};
let F, A, db, auth;

// Data dummy (hanya dipakai saat IS_PREVIEW = true)
const mem = IS_PREVIEW ? {
  profile:{nama:'Raka Pratama',jabatan:'Web Developer',bio:'Pengembang web yang suka membangun antarmuka cepat dan mudah dipakai. Terus belajar lewat kursus dan sertifikasi.',email:'raka@contoh.com',lokasi:'Bekasi, Indonesia',linkedin:'',github:'',instagram:'',fotoUrl:'',keahlian:['JavaScript','UI Design','Cloud','Firebase'],pendidikan:[{institusi:'Universitas Contoh',jurusan:'S1 Teknik Informatika',tahun:'2018 - 2022'},{institusi:'SMA Negeri 1 Bekasi',jurusan:'Ilmu Pengetahuan Alam',tahun:'2015 - 2018'}],pengalaman:[{institusi:'Studio Digital Contoh',jurusan:'Frontend Developer',tahun:'2022 - sekarang'}]},
  categories:[{id:'c1',nama:'Teknologi',ikon:'fa-code',warna:'#2f5233'},{id:'c2',nama:'Desain',ikon:'fa-palette',warna:'#ec4899'}],
  certificates:[
    {id:'s1',judul:'Google Cloud Fundamentals',penerbit:'Google Cloud',kategoriId:'c1',tahunTerbit:2025,deskripsi:'Dasar-dasar layanan cloud, penyimpanan, dan keamanan.',gambarUrl:'',credentialUrl:'',unggulan:true,createdAt:2},
    {id:'s2',judul:'UI/UX Design Essentials',penerbit:'Dicoding',kategoriId:'c2',tahunTerbit:2024,deskripsi:'Prinsip desain antarmuka, riset pengguna, dan prototipe.',gambarUrl:'',credentialUrl:'',unggulan:true,createdAt:1}],
  messages:[]
} : null;

// ---------- Lapisan data ----------
async function loadAll(){
  if (IS_PREVIEW){ S.cats=[...mem.categories]; S.certs=[...mem.certificates]; S.profile={...mem.profile}; return; }
  const get = async c => (await F.getDocs(F.collection(db,c))).docs.map(d=>({id:d.id,...d.data()}));
  [S.cats,S.certs] = await Promise.all([get('categories'),get('certificates')]);
  const p = await F.getDoc(F.doc(db,'profile','main'));
  S.profile = p.exists() ? p.data() : null;
}
async function save(col,id,data){
  if (IS_PREVIEW){
    if (col==='profile') mem.profile={...mem.profile,...data};
    else { id=id||uid(); const a=mem[col], i=a.findIndex(x=>x.id===id); i<0 ? a.push({id,...data}) : a[i]={...a[i],...data}; }
  } else {
    const ref = col==='profile' ? F.doc(db,'profile','main') : (id ? F.doc(db,col,id) : F.doc(F.collection(db,col)));
    await F.setDoc(ref,data,{merge:true});
  }
  await loadAll();
}
async function loadMsgs(){ if(IS_PREVIEW){ S.msgs=[...mem.messages].reverse(); return; } if(!S.user) return;
  S.msgs=(await F.getDocs(F.query(F.collection(db,'messages'),F.orderBy('createdAt','desc')))).docs.map(d=>({id:d.id,...d.data()})); }
async function sendMsg(d){ if(IS_PREVIEW) mem.messages.push({id:uid(),...d}); else await F.addDoc(F.collection(db,'messages'),d); }
async function remove(col,id){
  if (IS_PREVIEW) mem[col]=mem[col].filter(x=>x.id!==id); else await F.deleteDoc(F.doc(db,col,id));
  await loadAll();
}
async function run(fn,ok){ try{ await fn(); toast(ok); }catch(err){ toast('Gagal: '+(err.message||err),1); } }

// ---------- Util UI ----------
function toast(m,bad){ const t=$('#toast'); t.textContent=m; t.className='fixed left-1/2 -translate-x-1/2 top-4 z-[60] px-4 py-2 rounded-2xl text-white text-sm shadow-lg '+(bad?'bg-rose-600':'bg-indigo-700'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.add('hidden'),2800); }
function modal(h,w='max-w-xl'){ const m=$('#modal'); m.innerHTML=`<div class="glass bg-white rounded-3xl ${w} mx-auto my-6 p-5 sm:p-7 relative" style="background:#fff">${h}</div>`; m.classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); if(/^#sertifikat-/.test(location.hash)){ history.replaceState(null,'','#sertifikat'); setTitle(); } }
const catOf = id => S.cats.find(c=>c.id===id) || {nama:'Umum',ikon:'fa-certificate',warna:'#2f5233'};
const sorted = () => [...S.certs].sort((a,b)=>(b.tahunTerbit||0)-(a.tahunTerbit||0));
const empty = (ic,t,s) => `<div class="glass rounded-3xl p-10 text-center"><i class="fa-solid ${ic} text-4xl text-indigo-300 mb-3"></i><p class="fd font-bold text-lg">${t}</p><p class="text-sm text-slate-500 mt-1">${s}</p></div>`;
const hd=(t,s)=>`<div class="rounded-[2rem] p-6 sm:p-8 mb-6 text-white" style="background:#1a1712;border-top:4px solid #f5a800"><h1 class="fd text-3xl sm:text-4xl font-extrabold">${t}</h1><p class="text-white/60 mt-1 text-sm">${s}</p></div>`;
const field = (l,n,v='',t='text',x='') => `<label class="block text-sm font-semibold mb-3">${l}<input class="inp mt-1 font-normal" name="${n}" type="${t}" value="${e(v)}" ${x}></label>`;

function card(c){
  const k=catOf(c.kategoriId);
  return `<article class="tilt glass rounded-3xl overflow-hidden cursor-pointer mb-5 break-inside-avoid" onclick="openCert('${c.id}')" tabindex="0" onkeydown="if(event.key==='Enter')openCert('${c.id}')">
    <div class="relative overflow-hidden grid place-items-center text-white text-5xl" style="aspect-ratio:4/3;background:linear-gradient(135deg,${e(k.warna)},#f5a800)"><i class="fa-solid fa-certificate"></i>
      ${c.gambarUrl?`<img src="${e(c.gambarUrl)}" alt="" aria-hidden="true" class="absolute inset-0 w-full h-full object-cover scale-125 opacity-50" style="filter:blur(18px)" onerror="this.remove()"><img src="${e(c.gambarUrl)}" alt="${e(c.judul)}" loading="lazy" class="absolute inset-0 w-full h-full object-contain p-2" onload="this.parentNode.style.aspectRatio=Math.min(1.5,Math.max(.75,this.naturalWidth/this.naturalHeight))" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'absolute inset-x-0 bottom-0 bg-rose-600/90 text-white text-xs py-1 text-center',textContent:'Gambar gagal dimuat'}))">`:''}</div>
    <div class="p-5"><span class="inline-block text-xs font-semibold rounded-full px-3 py-1 mb-2" style="background:${e(k.warna)}33;color:#1a1712">${e(k.nama)}</span><h3 class="fd font-bold leading-snug">${e(c.judul)}</h3><p class="text-sm text-slate-500 mt-1">${e(c.penerbit)} · ${e(c.tahunTerbit)}</p></div></article>`;
}
function openCert(id,fr){
  if(!fr){ location.hash='sertifikat-'+id; return; }
  const c=S.certs.find(x=>x.id===id); if(!c){ toast('Sertifikat tidak ditemukan',1); return; } const k=catOf(c.kategoriId); document.title=c.judul+' | Portfolio';
  modal(`<button class="absolute right-3 top-3 z-20 w-9 h-9 rounded-full bg-white text-indigo-900 shadow-md hover:scale-110 transition" onclick="closeModal()" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button>
  <div class="relative h-52 rounded-2xl overflow-hidden grid place-items-center text-white text-6xl mb-4 ${c.gambarUrl?'cursor-zoom-in':''}" style="background:linear-gradient(135deg,${e(k.warna)},#f5a800)" ${c.gambarUrl?`onclick="zoom('${id}')"`:''}><i class="fa-solid ${e(k.ikon)}"></i>${c.gambarUrl?`<img src="${e(c.gambarUrl)}" alt="" class="absolute inset-0 w-full h-full object-contain bg-white" onerror="this.remove()"><span class="absolute right-2 bottom-2 text-xs bg-black/60 text-white rounded-full px-3 py-1"><i class="fa-solid fa-magnifying-glass-plus mr-1"></i>Perbesar</span>`:''}</div>
  <h2 class="fd text-xl font-bold">${e(c.judul)}</h2>
  <p class="text-sm text-slate-500 mt-1"><i class="fa-solid fa-building-columns mr-1"></i>${e(c.penerbit)} &nbsp; <i class="fa-regular fa-calendar mr-1"></i>${e(c.tahunTerbit)} &nbsp; <i class="fa-solid ${e(k.ikon)} mr-1"></i>${e(k.nama)}</p>
  <p class="mt-3 text-sm leading-relaxed">${e(c.deskripsi)||'Belum ada deskripsi.'}</p>
  <div class="flex flex-wrap gap-2 mt-5">${c.credentialUrl?`<a class="btn" href="${e(c.credentialUrl)}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i>Verifikasi</a>`:''}<button class="btn btn2" onclick="shareCert('${id}')"><i class="fa-solid fa-share-nodes"></i>Bagikan</button>${c.gambarUrl&&S.user?`<a class="btn btn2" href="${e(c.gambarUrl)}" download="${e(c.judul)}"><i class="fa-solid fa-download"></i>Unduh (admin)</a>`:''}</div>`);
}

// ---------- Tampilan ----------
const V = {
  home(){
    const P=S.profile||{}, f=sorted().filter(c=>c.unggulan).slice(0,5), pub=new Set(S.certs.map(c=>c.penerbit)).size, sk=P.keahlian||[];
    const tg=[...sk,...S.cats.map(c=>c.nama)], b=tg.length?tg:['Sertifikat','Portofolio'], sq=[...b,...b,...b].map(x=>`<span class="mx-7">${e(x)}</span><i class="fa-solid fa-asterisk"></i>`).join('');
    const ph=P.fotoUrl?`<img src="${e(P.fotoUrl)}" alt="${e(P.nama)}" class="blend w-full h-full object-contain object-bottom scale-[1.3] origin-bottom" onerror="this.remove()">`:'<i class="fa-solid fa-user text-8xl text-indigo-300"></i>';
    const chips=sk.slice(0,4).map((x,i)=>`<span class="inline-block m-0.5 rounded-full px-3 py-1 text-xs font-semibold ${i%2?'':'text-white'}" style="${i%2?'background:#f5a800;color:#1c2b1e':'background:#1a1712'}">${e(x)}</span>`).join('');
    const bm=(P.bio||'').match(/^[\s\S]*?[.!?](?=\s|$)/), bf=bm?bm[0]:(P.bio||''), bq=bf.length>120?bf.slice(0,120).replace(/\s+\S*$/,'')+'…':bf;
    const st=S.certs.length<3?'':`<button onclick="go('certs')" class="text-left glass rounded-2xl px-5 py-3 transition hover:-translate-y-0.5"><b class="fd text-3xl text-violet-500 block leading-none">${S.certs.length}</b><span class="text-sm font-semibold">Sertifikat</span><span class="block text-xs text-slate-500">dari ${pub} penerbit · ${S.cats.length} kategori</span></button>`;
    return `<section id="hero" class="relative text-center">
      <div class="p3d fd" role="img" aria-label="Portfolio">${[...'PORTFOLIO'].map((c,i)=>`<span aria-hidden="true" style="animation-delay:${-i*.18}s">${c}</span>`).join('')}</div>
      <h1 class="fd text-4xl sm:text-6xl font-extrabold leading-tight mt-4">Saya <span class="text-violet-500">${e(P.nama)||'Portofolio Saya'}</span></h1>
      <p class="text-slate-600 mt-2 min-h-[1.75rem]"><span id="tw"></span><span class="caret"></span></p>
      <div class="md:hidden mt-3">${st}</div>
      <button class="par absolute right-0 -top-2 w-20 h-20 hidden sm:block" onclick="go('contact')" aria-label="Hubungi saya" style="transform:translate(calc(var(--px,0)*20px),calc(var(--py,0)*16px))"><svg viewBox="0 0 100 100" class="spin w-full h-full"><circle cx="50" cy="50" r="49" fill="#1a1712"/><path id="cp" d="M50,50 m-35,0 a35,35 0 1,1 70,0 a35,35 0 1,1 -70,0" fill="none"/><text fill="#fff" font-size="9.5" font-weight="700"><textPath href="#cp" textLength="215" lengthAdjust="spacing">HUBUNGI SAYA • HUBUNGI SAYA •</textPath></text></svg><span class="absolute inset-0 m-auto w-9 h-9 rounded-full grid place-items-center" style="background:#f5a800;color:#1c2b1e"><i class="fa-solid fa-arrow-right text-xs"></i></span></button>
      <div class="hidden md:block absolute left-0 top-44 text-left w-48 z-10">${st}</div>
      <div class="hidden md:block absolute right-0 top-40 text-right w-52 z-10"><i class="fa-solid fa-quote-left text-violet-500 text-xl"></i><p class="text-sm text-slate-600 mt-1 mb-2">${e(bq)||'Profil belum diisi.'}</p>${(P.bio||'').length>bq.length?`<button class="block ml-auto text-xs font-semibold text-violet-600 mb-3" onclick="go('about')">Selengkapnya <i class="fa-solid fa-arrow-right"></i></button>`:'<div class="mb-3"></div>'}${chips}</div>
      <div class="relative mx-auto mt-2 h-[22rem] sm:h-[27rem] max-w-xl">

async function saveProfile(ev){ ev.preventDefault(); const f=new FormData(ev.target), d={};

  d.keahlian=f.get('keahlian').split(',').map(x=>x.trim()).filter(Boolean);
  const pl=k=>f.get(k).split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(a=>a[0]).map(a=>({institusi:a[0],jurusan:a[1]||'',tahun:a[2]||''})); d.pendidikan=pl('pendidikan'); d.pengalaman=pl('pengalaman');
  await run(()=>save('profile',null,d),'Profil disimpan'); render(); }
async function pdfToImg(fl,mx){
  if(!window.pdfjsLib){ await new Promise((ok,no)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }
  const pdf=await pdfjsLib.getDocument({data:await fl.arrayBuffer()}).promise, pg=await pdf.getPage(1), v0=pg.getViewport({scale:1}), vp=pg.getViewport({scale:mx/Math.max(v0.width,v0.height)}), c=document.createElement('canvas');
  c.width=vp.width; c.height=vp.height; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
  await pg.render({canvasContext:x,viewport:vp}).promise;
  let d=c.toDataURL('image/webp',.85); if(!d.startsWith('data:image/webp')) d=c.toDataURL('image/png'); return d; }
function pickPhoto(inp,nm='fotoUrl',pv='fprev',mx=640){ const fl=inp.files[0]; if(!fl) return;
  if(fl.type==='application/pdf'){ toast('Memproses PDF...'); pdfToImg(fl,mx).then(d=>{ inp.form[nm].value=d; $('#'+pv).innerHTML=`<img src="${d}" alt="" class="w-full h-full object-cover">`; toast('Halaman 1 PDF dipakai sebagai gambar'); }).catch(()=>toast('PDF tidak dapat dibaca',1)); return; } const im=new Image(), u=URL.createObjectURL(fl);
  im.onload=()=>{ const k=Math.min(1,mx/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=im.width*k; c.height=im.height*k; c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    let d=c.toDataURL('image/webp',.85); if(!d.startsWith('data:image/webp')) d=c.toDataURL('image/png'); inp.form[nm].value=d; $('#'+pv).innerHTML=`<img src="${d}" alt="" class="w-full h-full object-cover">`; URL.revokeObjectURL(u); };
  im.onerror=()=>toast('Foto tidak dapat dibaca',1); im.src=u; }

  let i=0,j=0,dl=false; (function tick(){ if(id!==twT||!document.body.contains(el)) return; const s=w[i]; j+=dl?-1:1; el.textContent=s.slice(0,j); let d=dl?40:90;
    if(!dl&&j===s.length){dl=true;d=1400;} else if(dl&&j===0){dl=false;i=(i+1)%w.length;d=300;} setTimeout(tick,d); })(); }
async function del(col,id){ let msg='Hapus data ini?';

  if(!confirm(msg)) return;
  await run(async()=>{ if(col==='categories') for(const c of S.certs.filter(c=>c.kategoriId===id)) await save('certificates',c.id,{kategoriId:''}); await remove(col,id); if(col==='messages') await loadMsgs(); },'Data dihapus'); render(); }
async function setTab(x){ S.tab=x; render(); if(x==='msgs'){ try{ await loadMsgs(); }catch(err){ toast('Gagal memuat pesan: '+err.message,1); } render(); } }
async function sendMsgForm(ev){ ev.preventDefault(); const f=new FormData(ev.target); if(f.get('website')) return;
  const d={nama:f.get('nama').trim().slice(0,100),email:f.get('email').trim().slice(0,150),pesan:f.get('pesan').trim().slice(0,2000),createdAt:Date.now()};
  await run(()=>sendMsg(d),'Pesan terkirim, terima kasih!'); ev.target.reset(); }
function zoom(id){ const c=S.certs.find(x=>x.id===id); if(!c||!c.gambarUrl) return;
  modal(`<button class="absolute right-3 top-3 z-20 w-9 h-9 rounded-full bg-white text-indigo-900 shadow-md" onclick="closeModal()" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button><img src="${e(c.gambarUrl)}" alt="${e(c.judul)}" class="w-full rounded-xl"><div class="flex gap-2 mt-4">${S.user?`<a class="btn" href="${e(c.gambarUrl)}" download="${e(c.judul)}"><i class="fa-solid fa-download"></i>Unduh (admin)</a>`:''}<button class="btn btn2" onclick="openCert('${id}',1)">Kembali</button></div>`,'max-w-4xl'); }
async function shareCert(id){ const u=location.href.split('#')[0]+'#sertifikat-'+id;
  try{ if(navigator.share){ await navigator.share({title:document.title,url:u}); return; } await navigator.clipboard.writeText(u); toast('Tautan disalin'); }catch{ toast('Tautan: '+u); } }
const yr=s=>+((String(s).match(/\d{4}/g)||[0]).pop());
const tl=(a,b,arr,ic)=>{ arr=[...(arr||[])].sort((x,y)=>yr(y.tahun)-yr(x.tahun)); return arr.length?`<section class="mt-10"><h2 class="fd text-2xl sm:text-3xl font-bold mb-5">${a} <i class="text-violet-500 font-semibold">${b}</i></h2><ol class="relative border-l-2 ml-3" style="border-color:#f5a800">${arr.map(x=>`<li class="mb-5 ml-8 relative"><span class="absolute -left-[3.05rem] top-3 w-8 h-8 rounded-full grid place-items-center text-sm" style="background:#f5a800;color:#1a1712"><i class="fa-solid ${ic}"></i></span><div class="glass rounded-2xl p-4"><div class="flex flex-wrap items-center justify-between gap-2"><b class="fd">${e(x.institusi)}</b>${x.tahun?`<span class="text-xs font-semibold rounded-full px-3 py-1" style="background:#fdf1cf;color:#1a1712">${e(x.tahun)}</span>`:''}</div><p class="text-sm text-slate-600 mt-1">${e(x.jurusan)}</p></div></li>`).join('')}</ol></section>`:''; };
const KEY={home:'beranda',about:'tentang',certs:'sertifikat',contact:'kontak',admin:'admin'}, TT={home:'Beranda',about:'Tentang',certs:'Sertifikat',contact:'Kontak',admin:'Admin'};
const setTitle=()=>{ document.title=TT[S.view]+' | '+((S.profile&&S.profile.nama)||'Portfolio'); };
function route(){ if(S.loading) return; const h=location.hash.slice(1), m=h.match(/^sertifikat-([A-Za-z0-9]+)$/), v=Object.keys(KEY).find(k=>KEY[k]===h);
  if(m){ S.view='certs'; render(); openCert(m[1],1); return; }
  $('#modal').classList.add('hidden'); if(v) S.view=v; render(); }
async function doLogin(ev){ ev.preventDefault(); const f=new FormData(ev.target), em=f.get('email').trim(), pw=f.get('pw'), er=$('#lerr');
  try{
    if(IS_PREVIEW){ if(em==='admin@demo.com'&&pw==='admin123') S.user={email:em}; else throw 0; }
    else await A.signInWithEmailAndPassword(auth,em,pw);
    toast('Berhasil masuk'); renderAll();
  }catch{ er.textContent='Email atau kata sandi salah.'; er.classList.remove('hidden'); } }
async function doLogout(){ if(!IS_PREVIEW) await A.signOut(auth); S.user=null; renderAll(); }
function go(v){ if(location.hash==='#'+KEY[v]){ S.view=v; render(); } else location.hash=KEY[v]; }
function drawGrid(){
  const g=$('#grid'); if(!g) return; const q=S.q.toLowerCase();
  let l=sorted().filter(c=>(S.cat==='all'||c.kategoriId===S.cat)&&(c.judul+' '+c.penerbit).toLowerCase().includes(q));
  if(S.sort==='old') l.reverse(); if(S.sort==='az') l.sort((a,b)=>a.judul.localeCompare(b.judul));
  const more=l.length>S.lim; l=l.slice(0,S.lim);
  g.innerHTML=l.length?l.map(card).join('')+(more?`<div class="text-center" style="column-span:all"><button class="btn btn2" onclick="S.lim+=9;drawGrid()">Muat lebih banyak</button></div>`:''):`<div style="column-span:all">${empty('fa-box-open',S.certs.length?'Tidak ada hasil':'Belum ada sertifikat',S.certs.length?'Coba kata kunci atau kategori lain.':'Admin dapat menambahkan sertifikat dari menu Admin.')}</div>`;
}

// ---------- Render ----------
const NAV=[['home','fa-house','Beranda'],['about','fa-user','Tentang'],['certs','fa-certificate','Sertifikat'],['contact','fa-envelope','Kontak'],['admin','fa-lock','Admin']];
function renderNav(){
  const P=S.profile||{}, on=v=>S.view===v;
  const av=P.fotoUrl?`<img src="${e(P.fotoUrl)}" alt="" class="w-full h-full object-cover object-top">`:'<i class="fa-solid fa-user"></i>';
  $('#side').innerHTML=`<div class="rounded-2xl p-3 flex items-center gap-3 mb-3" style="background:rgba(255,255,255,.1)"><span class="w-12 h-12 rounded-full grid place-items-center overflow-hidden shrink-0 text-white/80" style="box-shadow:0 0 0 2px #f5a800;background:#3f6b44">${av}</span><div class="min-w-0"><b class="fd block text-sm leading-tight" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${e(P.nama)||'Portofolio'}</b><span class="text-xs block leading-snug mt-0.5" style="color:#fcd34d;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${e(P.jabatan)||'Sertifikat'}</span></div></div>
    <p class="text-[10px] tracking-widest text-white/40 px-3 mb-1 font-semibold">MENU</p>`+
    NAV.map(n=>{const o=on(n[0]),ic=n[0]==='admin'&&S.user?'fa-gauge':n[1];
      return `<button onclick="go('${n[0]}')" class="group flex items-center gap-3 px-2 py-2 rounded-2xl text-sm font-semibold text-left transition-all duration-200 ${o?'':'text-white/75 hover:bg-white/10 hover:translate-x-1'}" style="${o?'background:#f5a800;color:#1a1712;box-shadow:0 10px 20px -10px #f5a800':''}"><span class="w-9 h-9 rounded-xl grid place-items-center transition ${o?'bg-white/40':'bg-white/10 group-hover:bg-white/20'}"><i class="fa-solid ${ic}"></i></span><span class="flex-1">${n[2]}</span>${o?'<i class="fa-solid fa-circle text-[6px]"></i>':''}</button>`}).join('')+
    `<div class="mt-auto pt-3">${S.user?'<p class="text-xs text-white/60 px-2 mb-2"><i class="fa-solid fa-circle text-[7px] text-emerald-400 mr-1.5"></i>Admin aktif</p>':''}<button onclick="go('contact')" class="w-full rounded-2xl p-4 text-left transition hover:-translate-y-0.5" style="background:linear-gradient(135deg,#f5a800,#fcd34d);color:#1a1712"><i class="fa-solid fa-paper-plane"></i><b class="fd block mt-1.5">Ayo terhubung</b><span class="text-xs opacity-80">Hubungi saya sekarang</span></button>`+
    (IS_PREVIEW?`<div class="mt-3 text-[11px] rounded-xl p-2.5 text-center" style="background:rgba(252,211,77,.15);color:#fcd34d"><i class="fa-solid fa-flask mr-1"></i>Mode Preview: data hanya di memori</div>`:'')+`</div>`;
  $('#bnav').innerHTML=NAV.map(n=>{const o=on(n[0]),ic=n[0]==='admin'&&S.user?'fa-gauge':n[1];
    return `<button onclick="go('${n[0]}')" aria-label="${n[2]}" class="flex-1 flex flex-col items-center gap-0.5 py-2 rounded-2xl text-[11px] font-semibold transition-all ${o?'':'text-white/70'}" style="${o?'background:#f5a800;color:#1a1712':''}"><i class="fa-solid ${ic} text-base"></i>${n[2]}</button>`}).join('');
}
function render(){
  renderNav();
  $('#view').innerHTML=S.loading?'<div class="grid place-items-center h-[60vh] text-indigo-500 text-3xl"><i class="fa-solid fa-circle-notch fa-spin"></i></div>':(IS_PREVIEW?'<div class="md:hidden mb-4 text-xs rounded-2xl bg-amber-50 text-amber-800 p-2.5 text-center"><i class="fa-solid fa-flask mr-1"></i>Mode Preview: data hanya di memori.</div>':'')+V[S.view]();
  if(!S.loading&&S.view==='certs') drawGrid();
  setTitle();
  S.view==='home'&&!S.loading?startTW():twT++;
  $('#app').scrollTo({top:0});
}
const renderAll=render;
Object.assign(window,{S,go,render,drawGrid,openCert,closeModal,acc,pickPhoto,zoom,shareCert,setTab,sendMsgForm,certForm,saveCert,catForm,saveCat,saveProfile,del,doLogin,doLogout});

document.addEventListener('contextmenu',ev=>{ if(!S.user&&ev.target.tagName==='IMG') ev.preventDefault(); });
document.addEventListener('dragstart',ev=>{ if(!S.user&&ev.target.tagName==='IMG') ev.preventDefault(); });
// Efek gerak mengikuti pointer
document.addEventListener('pointermove',ev=>{
  const h=ev.target.closest&&ev.target.closest('#hero');
  if(h){ const r=h.getBoundingClientRect(); h.style.setProperty('--px',((ev.clientX-r.left)/r.width-.5).toFixed(3)); h.style.setProperty('--py',((ev.clientY-r.top)/r.height-.5).toFixed(3)); }
  const t=ev.target.closest&&ev.target.closest('.tilt'); if(!t) return;
  const r=t.getBoundingClientRect(); t.style.setProperty('--ry',((ev.clientX-r.left)/r.width-.5)*12+'deg'); t.style.setProperty('--rx',-((ev.clientY-r.top)/r.height-.5)*12+'deg');
});
document.addEventListener('pointerleave',ev=>{
  const t=ev.target; if(!t.matches) return;
  if(t.matches('#hero')){ t.style.removeProperty('--px'); t.style.removeProperty('--py'); }
  else if(t.matches('.tilt')){ t.style.removeProperty('--ry'); t.style.removeProperty('--rx'); }
},true);

// PWA: daftarkan sw.js (taruh di folder yang sama dengan halaman ini)
try{ if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch{}

// ---------- Mulai ----------
window.addEventListener('hashchange',route);
(async()=>{
  render();
  try{
    if(!IS_PREVIEW){
      const b='https://www.gstatic.com/firebasejs/10.12.2/';
      const [m,fs,au]=await Promise.all([import(b+'firebase-app.js'),import(b+'firebase-firestore.js'),import(b+'firebase-auth.js')]);
      F=fs; A=au; const app=m.initializeApp(firebaseConfig); db=F.getFirestore(app); auth=A.getAuth(app);
      A.onAuthStateChanged(auth,u=>{S.user=u; render();});
    }
    await loadAll();
  }catch(err){ toast('Gagal memuat data: '+(err.message||err),1); }
  S.loading=false; route();
})();
</script>
