<script type="module">
// KONFIGURASI APLIKASI
const IS_PREVIEW = false; // Ubah menjadi false SAAT DEPLOY / PUBLISH agar terhubung murni ke Firebase tanpa data dummy

// PASTE FIREBASE CONFIG ANDA DI SINI
const firebaseConfig = {
  apiKey: "AIzaSyA1FKuhWFfr1IrPT2AT2EBZl7-UdLmeMAc",
  authDomain: "portfolioandrianasuherman.firebaseapp.com",
  projectId: "portfolioandrianasuherman",
  storageBucket: "portfolioandrianasuherman.firebasestorage.app",
  messagingSenderId: "363832387274",
  appId: "1:363832387274:web:730fb8c9b949c544bdb633"
};

const $ = s => document.querySelector(s);
const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const S = {view:'home', cats:[], certs:[], profile:null, user:null, q:'', cat:'all', tab:'certs', loading:true, sort:'new', lim:9, msgs:[], projects:[], awards:[], tech:[], edu:[], exp:[], ptab:'cert'};
let F, A, db, auth;

// Data dummy (hanya dipakai saat IS_PREVIEW = true)
const mem = IS_PREVIEW ? {
  profile:{nama:'Raka Pratama',jabatan:'Web Developer',bio:'A web developer who loves building fast, easy-to-use interfaces. Always learning through courses and certifications.',email:'raka@contoh.com',lokasi:'Bekasi, Indonesia',linkedin:'',github:'',instagram:'',fotoUrl:'',keahlian:['JavaScript','UI Design','Cloud','Firebase'],pendidikan:[{institusi:'Example University',jurusan:'BSc Computer Science',tahun:'2018 - 2022'},{institusi:'Bekasi State High School 1',jurusan:'Natural Sciences',tahun:'2015 - 2018'}],pengalaman:[{institusi:'Example Digital Studio',jurusan:'Frontend Developer',tahun:'2022 - present'}]},
  categories:[{id:'c1',nama:'Technology',ikon:'fa-code',warna:'#2f5233'},{id:'c2',nama:'Design',ikon:'fa-palette',warna:'#ec4899'}],
  certificates:[
    {id:'s1',judul:'Google Cloud Fundamentals',penerbit:'Google Cloud',kategoriId:'c1',tahunTerbit:2025,deskripsi:'Fundamentals of cloud services, storage, and security.',gambarUrl:'',credentialUrl:'',unggulan:true,createdAt:2},
    {id:'s2',judul:'UI/UX Design Essentials',penerbit:'Dicoding',kategoriId:'c2',tahunTerbit:2024,deskripsi:'Interface design principles, user research, and prototyping.',gambarUrl:'',credentialUrl:'',unggulan:true,createdAt:1}],
  messages:[],
  education:[{id:'e1',institusi:'Example University',jurusan:'BSc Computer Science',tahun:'2018 - 2022',logo:''}],
  experience:[{id:'x1',institusi:'Example Digital Studio',jurusan:'Frontend Developer',tahun:'2022 - present',logo:''}],
  projects:[{id:'p1',judul:'Portfolio App',deskripsi:'Portfolio website with Firebase.',tautan:'',tag:'Firebase, Tailwind'}],
  awards:[{id:'a1',judul:'Innovation Contest Runner-up',penyelenggara:'Example Campus',tahun:2024}],
  techstack:[{id:'t1',nama:'JavaScript',ikon:'fa-brands fa-js'},{id:'t2',nama:'Firebase',ikon:'fa-solid fa-fire'}]
} : null;

// ---------- Lapisan data ----------
async function loadAll(){
  if (IS_PREVIEW){ S.cats=[...mem.categories]; S.certs=[...mem.certificates]; S.profile={...mem.profile}; S.projects=[...mem.projects]; S.awards=[...mem.awards]; S.tech=[...mem.techstack]; S.edu=[...mem.education]; S.exp=[...mem.experience]; return; }
  const get = async c => (await F.getDocs(F.collection(db,c))).docs.map(d=>({id:d.id,...d.data()}));
  [S.cats,S.certs,S.projects,S.awards,S.tech,S.edu,S.exp] = await Promise.all(['categories','certificates','projects','awards','techstack','education','experience'].map(c=>get(c)));
  const p = await F.getDoc(F.doc(db,'profile','main'));
  S.profile = p.exists() ? p.data() : null;
}
async function save(col,id,data){
  if (IS_PREVIEW){
    if (col==='profile') mem.profile={...mem.profile,...data};
    else { id=id||uid(); const a=mem[col], i=a.findIndex(x=>x.id===id); i<0 ? a.push({id,...data}) : a[i]={...a[i],...data}; }
  } else {
    const ref = col==='profile' ? F.doc(db,'profile','main') : (id ? F.doc(db,col,id) : F.doc(F.collection(db,col)));
    await F.setDoc(ref,data,{merge:true});
  }
  await loadAll();
}
async function loadMsgs(){ if(IS_PREVIEW){ S.msgs=[...mem.messages].reverse(); return; } if(!S.user) return;
  S.msgs=(await F.getDocs(F.query(F.collection(db,'messages'),F.orderBy('createdAt','desc')))).docs.map(d=>({id:d.id,...d.data()})); }
async function sendMsg(d){ if(IS_PREVIEW) mem.messages.push({id:uid(),...d}); else await F.addDoc(F.collection(db,'messages'),d); }
async function remove(col,id){
  if (IS_PREVIEW) mem[col]=mem[col].filter(x=>x.id!==id); else await F.deleteDoc(F.doc(db,col,id));
  await loadAll();
}
async function run(fn,ok){ try{ await fn(); toast(ok); }catch(err){ toast('Failed: '+(err.message||err),1); } }

// ---------- Util UI ----------
function toast(m,bad){ const t=$('#toast'); t.textContent=m; t.className='fixed left-1/2 -translate-x-1/2 top-4 z-[60] px-4 py-2 rounded-2xl text-white text-sm shadow-lg '+(bad?'bg-rose-600':'bg-indigo-700'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.add('hidden'),2800); }
function modal(h,w='max-w-xl'){ const m=$('#modal'); m.innerHTML=`<div class="glass bg-white rounded-3xl ${w} mx-auto my-6 p-5 sm:p-7 relative" style="background:#0b1020">${h}</div>`; m.classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); if(/^#sertifikat-/.test(location.hash)){ history.replaceState(null,'','#sertifikat'); setTitle(); } }
const catOf = id => S.cats.find(c=>c.id===id) || {nama:'General',ikon:'fa-certificate',warna:'#2f5233'};
const sorted = () => [...S.certs].sort((a,b)=>(b.tahunTerbit||0)-(a.tahunTerbit||0));
const empty = (ic,t,s) => `<div class="glass rounded-3xl p-10 text-center"><i class="fa-solid ${ic} text-4xl text-indigo-300 mb-3"></i><p class="fd font-bold text-lg">${t}</p><p class="text-sm text-slate-500 mt-1">${s}</p></div>`;
const hd=(t,s)=>`<div class="rounded-[2rem] p-6 sm:p-8 mb-6 text-white" style="background:#1a1712;border-top:4px solid #f5a800"><h1 class="fd text-3xl sm:text-4xl font-extrabold">${t}</h1><p class="text-white/60 mt-1 text-sm">${s}</p></div>`;
const field = (l,n,v='',t='text',x='') => `<label class="block text-sm font-semibold mb-3">${l}<input class="inp mt-1 font-normal" name="${n}" type="${t}" value="${e(v)}" ${x}></label>`;

function card(c){
  const k=catOf(c.kategoriId);
  return `<article class="tilt glass rounded-3xl overflow-hidden cursor-pointer mb-5 break-inside-avoid" onclick="openCert('${c.id}')" tabindex="0" onkeydown="if(event.key==='Enter')openCert('${c.id}')">
    <div class="relative overflow-hidden grid place-items-center text-white text-5xl" style="aspect-ratio:4/3;background:linear-gradient(135deg,${e(k.warna)},#f5a800)"><i class="fa-solid fa-certificate"></i>
      ${c.gambarUrl?`<img src="${e(c.gambarUrl)}" alt="" aria-hidden="true" class="absolute inset-0 w-full h-full object-cover scale-125 opacity-50" style="filter:blur(18px)" onerror="this.remove()"><img src="${e(c.gambarUrl)}" alt="${e(c.judul)}" loading="lazy" class="absolute inset-0 w-full h-full object-contain p-2" onload="this.parentNode.style.aspectRatio=Math.min(1.5,Math.max(.75,this.naturalWidth/this.naturalHeight))" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'absolute inset-x-0 bottom-0 bg-rose-600/90 text-white text-xs py-1 text-center',textContent:'Image failed to load'}))">`:''}</div>
    <div class="p-5"><span class="inline-block text-xs font-semibold rounded-full px-3 py-1 mb-2" style="background:${e(k.warna)}33;color:#fff">${e(k.nama)}</span><h3 class="fd font-bold leading-snug">${e(c.judul)}</h3><p class="text-sm text-slate-500 mt-1">${e(c.penerbit)} · ${e(c.tahunTerbit)}</p></div></article>`;
}
function openCert(id,fr){
  if(!fr){ location.hash='sertifikat-'+id; return; }
  const c=S.certs.find(x=>x.id===id); if(!c){ toast('Certificate not found',1); return; } const k=catOf(c.kategoriId); document.title=c.judul+' | Portfolio';
  modal(`<button class="absolute right-3 top-3 z-20 w-9 h-9 rounded-full bg-white text-indigo-900 shadow-md hover:scale-110 transition" onclick="closeModal()" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
  <div class="relative h-52 rounded-2xl overflow-hidden grid place-items-center text-white text-6xl mb-4 ${c.gambarUrl?'cursor-zoom-in':''}" style="background:linear-gradient(135deg,${e(k.warna)},#f5a800)" ${c.gambarUrl?`onclick="zoom('${id}')"`:''}><i class="fa-solid ${e(k.ikon)}"></i>${c.gambarUrl?`<img src="${e(c.gambarUrl)}" alt="" class="absolute inset-0 w-full h-full object-contain bg-white" onerror="this.remove()"><span class="absolute right-2 bottom-2 text-xs bg-black/60 text-white rounded-full px-3 py-1"><i class="fa-solid fa-magnifying-glass-plus mr-1"></i>Enlarge</span>`:''}</div>
  <h2 class="fd text-xl font-bold">${e(c.judul)}</h2>
  <p class="text-sm text-slate-500 mt-1"><i class="fa-solid fa-building-columns mr-1"></i>${e(c.penerbit)} &nbsp; <i class="fa-regular fa-calendar mr-1"></i>${e(c.tahunTerbit)} &nbsp; <i class="fa-solid ${e(k.ikon)} mr-1"></i>${e(k.nama)}</p>
  <p class="mt-3 text-sm leading-relaxed">${e(c.deskripsi)||'No description yet.'}</p>
  <div class="flex flex-wrap gap-2 mt-5">${c.credentialUrl?`<a class="btn" href="${e(c.credentialUrl)}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i>Verify</a>`:''}<button class="btn btn2" onclick="shareCert('${id}')"><i class="fa-solid fa-share-nodes"></i>Share</button>${c.gambarUrl&&S.user?`<a class="btn btn2" href="${e(c.gambarUrl)}" download="${e(c.judul)}"><i class="fa-solid fa-download"></i>Download (admin)</a>`:''}</div>`);
}

// ---------- Tampilan ----------
const V = {
  home(){
    const P=S.profile||{}, f=sorted().filter(c=>c.unggulan).slice(0,5), pub=new Set(S.certs.map(c=>c.penerbit)).size, sk=P.keahlian||[];

async function pdfToImg(fl,mx){
  if(!window.pdfjsLib){ await new Promise((ok,no)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }
  const pdf=await pdfjsLib.getDocument({data:await fl.arrayBuffer()}).promise, pg=await pdf.getPage(1), v0=pg.getViewport({scale:1}), vp=pg.getViewport({scale:mx/Math.max(v0.width,v0.height)}), c=document.createElement('canvas');
  c.width=vp.width; c.height=vp.height; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
  await pg.render({canvasContext:x,viewport:vp}).promise;
  let d=c.toDataURL('image/webp',.85); if(!d.startsWith('data:image/webp')) d=c.toDataURL('image/png'); return d; }

  im.onload=()=>{ const k=Math.min(1,mx/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=im.width*k; c.height=im.height*k; c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    let d=c.toDataURL('image/webp',.85); if(!d.startsWith('data:image/webp')) d=c.toDataURL('image/png'); inp.form[nm].value=d; $('#'+pv).innerHTML=`<img src="${d}" alt="" class="w-full h-full object-cover">`; URL.revokeObjectURL(u); };
